<svg width="64" height="64" viewBox="-46 -46 92 92" xmlns="http://www.w3.org/2000/svg">
  <!-- Static favicon: the custody C monogram. Geometry mirrors
       CookeyMonogram in src/components/CookeyLogo.tsx — change one,
       change both. Ink on light tabs, paper on dark, via the embedded
       media query (SVG favicons honour prefers-color-scheme). -->
  <style>
    .mark { color: #23221E; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #E8E6DD; }
    }
  </style>
  <g class="mark">
    <path d="M 25.2 19.7 A 32 32 0 1 1 25.2 -19.7"
          fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round"/>
    <rect x="29" y="-7" width="14" height="14" fill="currentColor"/>
  </g>
</svg>
