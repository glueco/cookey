<svg width="64" height="64" viewBox="-46 -46 92 92" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cookey">
  <!-- The custody C — Cookey's official mark. Geometry mirrors
       CookeyMonogram in apps/proxy/src/components/CookeyLogo.tsx and
       apps/proxy/src/app/icon.svg — change one, change all three.
       Theme-adaptive: ink on light, paper on dark. -->
  <style>
    .mark { color: #23221E; }
    @media (prefers-color-scheme: dark) {
      .mark { color: #E8E6DD; }
    }
  </style>
  <g class="mark">
    <path d="M 25.2 19.7 A 32 32 0 1 1 25.2 -19.7"
          fill="none" stroke="currentColor" stroke-width="20" stroke-linecap="round"/>
    <rect x="29" y="-7" width="14" height="14" fill="currentColor"/>
  </g>
</svg>
