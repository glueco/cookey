[project]
name = "glueco-sdk"
version = "1.0.0"
description = "Cookey gateway SDK - PoP (Ed25519) signing for long-lived grants. Bearer-token users need no SDK."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Glueco", email = "dev@glueco.io"}
]
keywords = ["gateway", "proxy", "pop", "ed25519", "authentication"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.24.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/glueco/cookey"
Documentation = "https://github.com/glueco/cookey/tree/main/docs"
Repository = "https://github.com/glueco/cookey"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glueco_sdk"]
